name: Build Zayn Play APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "zayn-play-apk"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode signing keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/zaynplay.keystore"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build signed release APK
        run: ./gradlew :app:assembleStableRelease --stacktrace
        env:
          ZAYN_STORE_FILE: ${{ runner.temp }}/zaynplay.keystore
          ZAYN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZAYN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZAYN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zayn-play-1.0.5
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          retention-days: 30
